# ════════════════════════════════════════════════════════════════
# DECAP CMS — Configuration du panel d'admin pour Loadjaxx
# Documentation : https://decapcms.org/docs/intro/
# ════════════════════════════════════════════════════════════════

backend:
  name: git-gateway      # Storage = ton repo GitHub via Netlify Git Gateway
  branch: master         # Branche cible (les modifs commitent ici directement)

# Dossier où Decap upload les images quand on les drop dans un champ image
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

# Langue d'interface
locale: fr

# Active la page d'accueil avec aperçu site embarqué
display_url: https://loadjaxx.com
site_url:    https://loadjaxx.com

# ─────────────────────────────────────────────────────────────────
# COLLECTIONS — Ce que l'artiste peut éditer
# Pour cette première version : uniquement les SHOWS (dates de tournée).
# On ajoutera d'autres collections (about, hero stats, releases…) plus tard.
# ─────────────────────────────────────────────────────────────────
collections:
  - name: "shows"
    label: "Dates & Shows"
    label_singular: "Show"
    description: "Ajoute, modifie ou supprime tes dates de concert. Les dates passées sont automatiquement archivées."
    files:
      - name: "shows-list"
        label: "Liste des dates"
        file: "data/shows.json"
        format: "json"
        fields:
          - name: shows
            label: "Tes dates"
            label_singular: "date"
            widget: list
            summary: "{{date}} · {{venue}} · {{city}}"
            fields:
              - name: date
                label: "Date du show"
                widget: datetime
                format: "YYYY-MM-DD"
                date_format: "YYYY-MM-DD"
                time_format: false
                picker_utc: false
              - name: time
                label: "Heure de début"
                widget: string
                required: false
                default: "22h00"
                hint: "Format libre : '22h00', '21h30', 'TBA'…"
              - name: venue
                label: "Lieu (club / festival)"
                widget: string
                hint: "Ex: Glow Up, Warehouse Festival, Studio M…"
              - name: city
                label: "Ville"
                widget: string
                hint: "Ex: Paris, Lyon, Marseille… (positionné automatiquement sur la carte si ville française connue)"
              - name: country
                label: "Pays"
                widget: string
                default: "France"
              - name: lat
                label: "Latitude (optionnel)"
                widget: number
                required: false
                value_type: "float"
                hint: "Laisse vide si la ville est reconnue automatiquement. Remplis seulement pour les lieux exotiques ou les festivals isolés."
              - name: lng
                label: "Longitude (optionnel)"
                widget: number
                required: false
                value_type: "float"
                hint: "Idem latitude"
              - name: sold_out
                label: "Sold Out ?"
                widget: boolean
                default: false
                hint: "Coche si la date est complète — un tampon orange apparaît sur le site"
              - name: link
                label: "Lien externe (billetterie / replay)"
                widget: string
                required: false
                hint: "Optionnel — laisse vide pour pointer vers le formulaire de contact"
              - name: link_label
                label: "Texte du bouton"
                widget: string
                required: false
                default: "Billets"
                hint: "Ex: 'Billets', 'Replay', 'Infos'"
